<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create your museum | Our Museum</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <main class="editor">
    <a class="back" href="index.html">← Our Museum</a>
    <h1>Create a memory space</h1>
    <p class="intro">Give your museum a name, add photographs and a message.</p>
    <form id="museum-form">
      <label for="museum-title">Museum name</label>
      <input id="museum-title" name="title" maxlength="80" required placeholder="Our favourite memories">
      <label for="recipient">Who is it for?</label>
      <input id="recipient" name="recipient" maxlength="100" placeholder="A name or dedication">
      <label for="message">Your message</label>
      <textarea id="message" name="message" rows="4" maxlength="1000" placeholder="Write something meaningful…"></textarea>
      <label class="upload" for="photos"><strong>Add photographs</strong><span>Choose multiple JPG, PNG, WebP or GIF images.</span></label>
      <input id="photos" name="photos" type="file" accept="image/*" multiple>
      <div id="preview" class="preview" aria-live="polite"></div>
      <button class="button" type="submit">Create museum</button>
    </form>
    <section id="share-result" class="share-result" hidden aria-live="polite"></section>
    <p class="note">Prototype notice: uploads are saved only in this browser. This version does not yet create real accounts or cloud share links.</p>
  </main>
  <script src="js/admin.js"></script>
</body>
</html>
